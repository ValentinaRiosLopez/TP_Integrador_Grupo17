<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP INTEGRADOR</title>
    <link
      rel="shortcut icon"
      href="../public/static/imagenes/logo.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../public/static/estilos/carrito.css" />
    <link rel="stylesheet" href="../public/static/estilos/style.css" />
  </head>
  <body>
    <header>
      <div id="imagen-logo">
        <img src="../public/static/imagenes/logo.png" alt="Imagen Logo" />
      </div>
      <div id="nombre-negocio">
        <h1>Ludonautica</h1>
        <h5>Rios Lopez Valentina - Rodriguez Ventura Facundo</h5>
      </div>
      <div id="contenedor-menu">
        <nav>
          <ul id="menu-principal">
            <li id="li-inicio"><a href="/">Inicio</a></li>
            <li id="li-productos">
              <a href="/productos">Productos</a>
              <ul id="menu-secundario">
                <li><a href="/productos/juegos">Juegos de Mesa</a></li>
                <li><a href="/productos/dados">Dados</a></li>
                <li><a href="/productos">Todos</a></li>
              </ul>
            </li>
            <li id="li-carrito"><a href="/carrito">Carrito</a></li>
            <li id="li-ticket"><a href="/ticket">Ticket</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="contenido">
      <div id="carrito">
        <h2>Carrito</h2>
        <div id="items-carrito">
          <table id="tabla-carrito">
            <tbody id="productos-carrito"></tbody>
            <tfoot id="total-carrito">
              <tr id="fila-total">
                <td>Total:</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </main>
    <footer>
      <section id="info-contacto">
        <h3>Contacto</h3>
        <div id="informacion">
          <p>Telefono: +54 9 11 0000-0000</p>
          <p>Mail: /ludonautica_@gmail.com</p>
          <p>Instagram: @/ludonautica_</p>
          <p>Facebook: @/ludonautica_</p>
        </div>
      </section>
    </footer>
  </body>
</html>
